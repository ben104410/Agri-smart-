services:
  - type: web
    name: agrismart
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn agrismart_project.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: DEFAULT_FARM_LOCATION
        value: "Mombasa, Coastal Kenya"
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: agrismart-db
          property: connectionString

databases:
  - name: agrismart-db
    plan: free
    databaseName: agrismart
    user: agrismart
